name: CourseBuilder
options:
  bundleIdPrefix: golf.spot
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  minimumXcodeGenVersion: "2.38.0"
  localPackagesGroup: Packages
settings:
  base:
    SWIFT_VERSION: "5.9"
packages:
  CourseData:
    path: ../CourseData
fileGroups:
  - CLAUDE.md
  - README.md
  - project.yml
  - plans
targets:
  CourseBuilder:
    type: application
    platform: macOS
    sources:
      - CourseBuilder
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: CourseBuilder/Resources/CourseBuilder.entitlements
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_NSLocationUsageDescription: "CourseBuilder uses your location for course distance verification"
    dependencies:
      - package: CourseData
    scheme:
      testTargets:
        - CourseBuilderTests
  CourseBuilderTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - CourseBuilderTests
    resources:
      - path: CourseBuilderTests/Overpass
        type: folder
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: CourseBuilder
